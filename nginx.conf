# ============================================================
# CryptoDesk — config nginx (headers de sécurité + SEO)
# ============================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---------- Endpoint santé (monitoring) ----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------- Compression ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # ---------- Headers de sécurité ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;
    # HSTS : force HTTPS pendant 1 an (y compris sous-domaines)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP : site statique sans JS tiers ni ressources externes
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---------- SEO : fichiers spéciaux ----------
    location = /robots.txt { add_header Content-Type text/plain; }
    location = /llms.txt  { add_header Content-Type text/plain; add_header Cache-Control "public, max-age=3600"; }
    location = /sitemap-index.xml { add_header Content-Type application/xml; }
    location = /rss.xml { add_header Content-Type application/rss+xml; }

    # ---------- Cache des assets statiques (hashés par Astro) ----------
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- Fichiers statiques généraux ----------
    location / {
        try_files $uri $uri/ $uri.html =404;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ---------- Page 404 personnalisée ----------
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
